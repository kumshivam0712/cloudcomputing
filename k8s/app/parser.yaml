# Task 4: the inference service in namespace "app".
# Deployment (2 replicas, requests/limits, probes, zero-downtime rolling update), Service,
# Traefik Ingress for /parse (+ health paths), and a CPU HorizontalPodAutoscaler (1..2, 70 %).
apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parser-config
  namespace: app
data:
  S3_ENDPOINT: http://seaweedfs-s3.data.svc.cluster.local:8333
  MAX_NEW_TOKENS: "48"
  FAULT_INJECT: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
  labels:
    app: parser
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: parser
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # start one new Pod first ...
      maxUnavailable: 0    # ... and remove an old one only when the new one is Ready
  template:
    metadata:
      labels:
        app: parser
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: parser
          image: ccmini/parser:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_URI
              value: s3://models/v1/
            - name: MODEL_VERSION
              value: v1
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: parser-config     # S3_ENDPOINT, MAX_NEW_TOKENS, FAULT_INJECT
            - secretRef:
                name: s3-credentials    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (never in Git)
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:               # 503 until the model is downloaded and loaded
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 2
            timeoutSeconds: 2
          livenessProbe:                # restarts the container only if the process hangs
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:                    # keep serving while Traefik drops this endpoint
              exec:
                command: ["sleep", "8"]
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: parser
  namespace: app
  labels:
    app: parser
spec:
  selector:
    app: parser
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Exact
            backend:
              service:
                name: parser
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: parser
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: parser
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parser
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parser
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70     # % of the 500m CPU request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60  # default is 300 s; shortened so the demo fits in CI
