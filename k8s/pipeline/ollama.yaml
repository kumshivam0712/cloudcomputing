# Teacher model server (Ollama, phi3.5) running inside the cluster, namespace "pipeline".
# The model itself is pulled after start-up by `make teacher-up`
# (kubectl exec deploy/ollama -- ollama pull phi3.5) and kept on a PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: pipeline
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: pipeline
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.5.7
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # one decoding slot per labelling worker, so the workers are served concurrently
            - name: OLLAMA_NUM_PARALLEL
              value: "__SHARD_COUNT__"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: "3h"
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 12Gi     # no CPU limit: the teacher may use every core of the node
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: pipeline
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
