# Parallel teacher labelling (Task 1): an Indexed Job runs SHARD_COUNT worker Pods at the same
# time in namespace "pipeline". Pod i gets SHARD_INDEX=i from its completion index and writes
# s3://datasets/teacher/shard-<i>.jsonl.  Rendered by `make label` (__SHARD_COUNT__, __LIMIT__).
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-labeler
  namespace: pipeline
  labels:
    app: teacher-labeler
spec:
  completionMode: Indexed
  completions: __SHARD_COUNT__
  parallelism: __SHARD_COUNT__
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: teacher-labeler
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: ccmini/worker:1.0
          imagePullPolicy: Never
          env:
            - name: SHARD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: SHARD_COUNT
              value: "__SHARD_COUNT__"
            - name: LIMIT                 # 0 = whole pool; >0 = smoke test on the first N lines
              value: "__LIMIT__"
            - name: INPUT_URI
              value: s3://datasets/commands_pool.jsonl
            - name: OUTPUT_URI
              value: s3://datasets/teacher/shard-{index}.jsonl
            - name: OLLAMA_URL
              value: http://ollama.pipeline.svc.cluster.local:11434
            - name: TEACHER_MODEL
              value: phi3.5
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.data.svc.cluster.local:8333
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
